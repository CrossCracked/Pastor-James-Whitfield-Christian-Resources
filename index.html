<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pastor James Whitfield Christian Resources</title>

<style>

body{
background:#111827;
color:white;
font-family:Arial,Helvetica,sans-serif;
margin:0;
}

header{
background:#1f2937;
padding:30px;
text-align:center;
}

h1{
margin:0;
font-size:42px;
}

nav{
background:#374151;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:20px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
}

.quoteBox{
background:#1f2937;
padding:30px;
border-radius:10px;
font-size:22px;
line-height:1.6;
margin-top:30px;
}

button{
padding:15px 25px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:20px;
}

footer{
margin-top:60px;
padding:20px;
text-align:center;
background:#1f2937;
}

</style>

</head>

<body>

<header>

<h1>Pastor James Whitfield Christian Resources</h1>

<p>Historical Christian Sources • Church Fathers • Councils</p>

</header>

<nav>

<a href="#">Home</a>

<a href="#">Articles</a>

<a href="#">Quotes</a>

<a href="#">Search</a>

</nav>

<div class="container">

<h2>🎲 Church Father Roulette</h2>

<div class="quoteBox" id="quote">

Click the button to begin.

</div>

<button onclick="randomQuote()">

Random Quote

</button>

</div>

<footer>

Website under construction

</footer>

<script>

const quotes=[

"Tertullian: 'What indeed has Athens to do with Jerusalem?'",

"Origen: 'The Scriptures have a spiritual meaning beyond the literal.'",

"Augustine: 'Our hearts are restless until they rest in You.'",

"John Chrysostom: 'Prayer is the root, the fountain, the mother of a thousand blessings.'"

];

function randomQuote(){

const q=quotes[Math.floor(Math.random()*quotes.length)];

document.getElementById("quote").innerHTML=q;

}

</script>

</body>
